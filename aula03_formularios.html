<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="#" >
        <label for="Nome"> Nome</label>
        <input type="text" placeholder="Digite Seu Nome:"> <br>
        <label for=""> Telefone</label>
        <input type="text" placeholder="Digite Seu Telefone:"> <br>
        <label for="">Email</label>
        <input type="email" placeholder="Digite Seu email"> <br>
        <label for="">Senha</label>
        <input type="password" placeholder="Digite sua Senha"> <br>
        
        <label for=""> Onde voce mora? </label> <br>
        <select >
            
            <option value="Brasil">Brasil</option>
            <option value="Argentina">Argentina</option>
            <option value="Uruguai">Uruguai</option>
        </select> <br>

        <label for=""> Etnia </label> <br>

            <option value="Negro">Negro</option>
            <option value="Branco">Branco</option>
            <option value="Pardo">Pardo</option>

        <label for=""> Genero </label> <br>
        <select >
            
            <option value="Homem">Homem</option>
            <option value="Mulher">Mulher</option>
            <option value="Outros">Outros</option>

        <label for="mensagem">Mensagem</label> <br>
        <textarea placeholder="Digite uma mensagem"></textarea> <br>
        <button type="submit">Enviar Dados</button> <br>
        <button type="reset">Limpar Dados</button> <br>
    </form>
</body>
</html>
